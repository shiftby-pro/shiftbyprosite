name: "Deploy to Environments"

on:
  push:
    branches:
      - dev
      - qa
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - qa
          - production

jobs:
  deploy-dev:
    name: Deploy to Development
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: development
      url: https://dev.shiftbypro.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Dev
      run: |
        echo "Deploying to development environment"
        echo "Environment: development"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
    
    - name: Deployment Summary
      run: |
        echo "✅ Deployment to development completed successfully"

  deploy-qa:
    name: Deploy to QA
    if: github.ref == 'refs/heads/qa' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: qa
      url: https://qa.shiftbypro.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to QA
      run: |
        echo "Deploying to QA environment"
        echo "Environment: qa"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
    
    - name: Deployment Summary
      run: |
        echo "✅ Deployment to QA completed successfully"

  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://shiftbypro.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment"
        echo "Environment: production"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
    
    - name: Deployment Summary
      run: |
        echo "✅ Deployment to production completed successfully"
