name: Promote Branch via PR

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch or ref to promote from"
        required: false
        default: "dev"
      target_branch:
        description: "Branch to promote into"
        required: false
        default: "qa"
      title_suffix:
        description: "Optional suffix for the pull request title"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ github.event.inputs.source_branch || 'dev' }}
      TARGET: ${{ github.event.inputs.target_branch || 'qa' }}
      TITLE_SUFFIX: ${{ github.event.inputs.title_suffix }}
      PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${PROMOTION_TOKEN}" ]; then
            echo "PROMOTION_TOKEN secret is required for pushing promotion branches." >&2
            exit 1
          fi
          echo "Promoting '${SOURCE}' into '${TARGET}'"

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.PROMOTION_TOKEN }}

      - name: Create promotion branch
        id: create_branch
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE" "$TARGET"
          git checkout "origin/$SOURCE"
          BRANCH="promote-${SOURCE}-to-${TARGET}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git remote set-url origin "https://x-access-token:${PROMOTION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PROMOTION_TOKEN }}
          branch_name: ${{ steps.create_branch.outputs.branch_name }}
          script: |
            const source = process.env.SOURCE;
            const target = process.env.TARGET;
            const branchName = core.getInput('branch_name', { required: true });
            const suffix = process.env.TITLE_SUFFIX ? ` - ${process.env.TITLE_SUFFIX}` : '';
            const title = `Promote ${source} to ${target}${suffix}`;
            const { data } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branchName,
              base: target,
              title,
              body: `Automatically generated promotion PR to sync \`${source}\` into \`${target}\` from workflow run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });
            core.setOutput('pr_url', data.html_url);
            core.setOutput('pr_number', data.number.toString());

      - name: Summary
        run: |
          echo "Promotion branch created: ${{ steps.create_branch.outputs.branch_name }}"
          echo "Pull request: ${{ steps.create_pr.outputs.pr_url }}"
